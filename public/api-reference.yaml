### POST /api/kb/delete
删除知识库 API

**Types:** DeleteRequest (请求)

Request Body:
  type: DeleteRequest
  - `id`: string (required)

Response Body:
  200: 成功响应

### POST /api/kb/ingest
文本入库 API

**Types:** IngestTextResponse (响应)

Request Body:
  支持多种请求体格式 (oneOf):
  - IngestTextRequest:
      - `kbId`: string (required)
      - `content`: string (required)
  - IngestMessagesRequest:
      - `kbId`: string (required)
      - `messages`: IngestMessage[] (required)

Response Body:
  200: 成功响应（SSE 流式响应）
    Content-Type: text/event-stream
    事件格式: data: { type: string, message?: string, data?: object }
    事件类型:
      - status: 状态更新通知 → message: string
      - progress: 处理进度更新 → object
      - chunk_detail: 片段处理详情 → object
      - complete: 处理完成 → IngestTextResponse
      - error: 处理出错 → message: string, code: string

